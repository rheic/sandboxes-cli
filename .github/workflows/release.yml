name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7_gate:
    runs-on: ubuntu-24.04
    environment: m7-external-security-review
    permissions: {}
    env:
      M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT: ${{ vars.M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT }}
    steps:
      - name: Require explicit M7 security review approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ || "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Release blocked: M7 approval must name this exact reviewed commit in the protected environment." >&2
            exit 1
          fi
  build:
    needs: m7_gate
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GOTOOLCHAIN: local
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch protected main for ancestry validation
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify pinned Go toolchain
        run: test "$(go version)" = "go version go1.27.4 linux/amd64"
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          head_commit=$(git rev-parse HEAD)
          [[ "$tag_commit" == "$head_commit" ]]
          git merge-base --is-ancestor "$tag_commit" origin/main
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/test-release-notes.sh
          scripts/extract-release-notes.sh "$VERSION" >/dev/null
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/rsbx-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/rheic/sandboxes-cli/internal/version.Version=$VERSION" -o "$out" ./cmd/rsbx
            (cd dist && sha256sum "${out#dist/}") > "$out.sha256"
          done
          actual=$(dist/rsbx-linux-amd64 version)
          grep -Eq "^rsbx version v${VERSION}([[:space:]]|$)" <<<"$actual"
      - name: Install CycloneDX generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -licenses -type library -output dist/rsbx.cdx.json .
      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/rsbx-darwin-arm64,dist/rsbx-darwin-amd64,dist/rsbx-linux-arm64,dist/rsbx-linux-amd64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rsbx-darwin-arm64,dist/rsbx-darwin-amd64,dist/rsbx-linux-arm64,dist/rsbx-linux-amd64
          sbom-path: dist/rsbx.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate release tag before publishing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded release assets
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish release assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes_file=$(mktemp)
            trap 'rm -f "$notes_file"' EXIT
            version="${TAG#v}"
            scripts/extract-release-notes.sh "$version" > "$notes_file"
            [[ -s "$notes_file" ]]
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes_file"
          fi
          for asset in dist/*; do
            name=${asset##*/}
            digest=$(sha256sum "$asset" | cut -d ' ' -f 1)
            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | \
              jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "UNKNOWN")')
            if [[ -z "$existing" ]]; then
              gh release upload "$TAG" "$asset"
            elif [[ "$existing" == "sha256:$digest" ]]; then
              echo "Release asset already matches: $name"
            else
              echo "Refusing to replace conflicting or unverifiable release asset: $name" >&2
              exit 1
            fi
          done
