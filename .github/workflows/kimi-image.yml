name: kimi-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  m7_gate:
    runs-on: ubuntu-24.04
    environment: m7-external-security-review
    permissions: {}
    env:
      M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT: ${{ vars.M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT }}
    steps:
      - name: Require explicit M7 security review approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ || "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Publication blocked: M7 approval must name this exact reviewed commit in the protected environment." >&2
            exit 1
          fi
  build:
    needs: m7_gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agents/kimi
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rheic/sandbox-kimi:0.43.0
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/rheic/sandbox-kimi
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          oci://ghcr.io/rheic/sandbox-kimi@${{ steps.push.outputs.digest }}
          --repo rheic/sandboxes-cli
          --signer-workflow rheic/sandboxes-cli/.github/workflows/kimi-image.yml
