name: codex-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  m7_gate:
    runs-on: ubuntu-24.04
    environment: m7-external-security-review
    permissions: {}
    env:
      M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT: ${{ vars.M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT }}
    steps:
      - name: Require explicit M7 security review approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ || "$M7_EXTERNAL_SECURITY_REVIEW_APPROVED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Publication blocked: M7 approval must name this exact reviewed commit in the protected environment." >&2
            exit 1
          fi
  build:
    needs: m7_gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build flattened Codex image
        id: publish
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/arm64 docker/sandbox-templates@sha256:982f4518e7e5544e92a23e7fb7eaca9cd5ce9c7178782155a628c92ed723d9de
          cid=$(docker create --platform linux/arm64 docker/sandbox-templates@sha256:982f4518e7e5544e92a23e7fb7eaca9cd5ce9c7178782155a628c92ed723d9de)
          docker export "$cid" -o rootfs.tar
          docker rm "$cid"
          tar --format=ustar --transform='s,^,dev/,' -rf rootfs.tar -C /dev null zero random urandom
          docker import --platform linux/arm64 \
            --change 'ENV PATH=/home/agent/.local/bin:/usr/local/share/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --change 'ENV BASH_ENV=/etc/sandbox-persistent.sh' \
            --change 'WORKDIR /home/agent/workspace' --change 'USER agent' \
            --change 'LABEL com.docker.sandboxes.start-docker=true' \
            --change 'ENTRYPOINT ["tini","--"]' --change 'CMD ["codex"]' \
            rootfs.tar ghcr.io/rheic/sandbox-codex:0.1
          docker push ghcr.io/rheic/sandbox-codex:0.1
          docker buildx imagetools inspect --raw ghcr.io/rheic/sandbox-codex:0.1 \
            > "$RUNNER_TEMP/rheic-codex-manifest.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/rheic-codex-manifest.json" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/rheic/sandbox-codex
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          oci://ghcr.io/rheic/sandbox-codex@${{ steps.publish.outputs.digest }}
          --repo rheic/sandboxes-cli
          --signer-workflow rheic/sandboxes-cli/.github/workflows/codex-image.yml
